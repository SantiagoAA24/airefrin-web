<div id="root" style="padding:28px;background:var(--white);min-height:100%;box-sizing:border-box"></div>
<script>
var A = window.Airefrin, h = React.createElement;
function Demo(){ var names=['wrench','snow','gear','therm','cal','shield','hand','build','home','shop','fact','clip','tool','check','phone','whatsapp','mail','pin','arrow'];
return h('div',{style:{display:'flex',flexWrap:'wrap',gap:24,color:'var(--blue-600)'}}, names.map(function(n){return h('div',{key:n,style:{display:'flex',flexDirection:'column',alignItems:'center',gap:8,width:64,font:'500 12px var(--font-sans)',color:'var(--text)'}},h(A.Icon,{name:n,size:36}),n);})); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
