<script>
var A = window.Airefrin, h = React.createElement;
function Demo(){ return h('div',{style:{display:'flex',flexWrap:'wrap',gap:24}},[['cal','2012','Año de fundación'],['shield','3 meses','Mantenimiento recomendado'],['hand','8','Marcas aliadas']].map(function(x){return h('div',{key:x[1],style:{flex:'1 1 220px'}},h(A.StatItem,{icon:x[0],value:x[1],label:x[2]}));})); }
