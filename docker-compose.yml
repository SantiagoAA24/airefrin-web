services:
  db:
    image: postgres:16-alpine
    container_name: airefrin-db
    environment:
      POSTGRES_USER: airefrin
      POSTGRES_PASSWORD: airefrin
      POSTGRES_DB: airefrin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airefrin -d airefrin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
